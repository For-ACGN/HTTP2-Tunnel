[common]
  password = "test"
  log_path = "http2-tunnel.log"

[client]
  timeout   = "15s"
  pre_conns = 16

[server]
  network  = "tcp"
  address  = "1.1.1.1:443"
  root_ca  = ""  # ca file path
  cert_pin = ["64-bytes-hex-string"]

[front]
  network  = "tcp"
  address  = "127.0.0.1:2026"
  username = ""
  password = ""

[tunnel]
  buffer_size  = 2048
  jitter_level = 3    # 1 - 10

[android]
  dns_server = "8.8.8.8:53"
